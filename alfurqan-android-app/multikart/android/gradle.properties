org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 17/09 BUILD-FIX: AGP 8.8+ me `android.enableJetifier=true` HARD ERROR
# ban gaya hai (Jetifier AGP 8.x se deprecated, 9.0 me removed). Project ke
# SARHE plugins (firebase, sqflite, image_picker, webview, share_plus...)
# pehle se AndroidX-native hain — kisi ko jetifier chahiye hi nahi, isliye
# false karna 100% safe hai.
android.enableJetifier=false
