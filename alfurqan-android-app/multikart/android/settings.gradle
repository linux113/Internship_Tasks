pluginManagement {
    def properties = new Properties()
    file("local.properties").withInputStream { properties.load(it) }
    def flutterSdkPath = properties.getProperty("flutter.sdk")
    if (flutterSdkPath == null) {
        throw new GradleException("flutter.sdk not set in local.properties")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 17/09 BUILD-FIX (Lalit PC par checkReleaseAarMetadata fail): Naye
    // androidx.core 1.18.0 / androidx.activity 1.12.4 / navigationevent
    // 1.0.2 (image_picker ke saath aaye) ki AAR metadata minimum AGP
    // 8.9.1 maangti hai — template ka pin 8.7.3 kam tha. Wrapper pehle se
    // gradle-8.12 hai (AGP 8.9.x ko minimum 8.11.1 chahiye) isliye sirf AGP
    // bump kaafi hai. Kotlin 2.1.0 AGP 8.9 ke saath compatible.
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.3.15" apply false
}

include(":app")
